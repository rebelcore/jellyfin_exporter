---
name: Create Tag

on:
  push:
    branches:
      - master
      - beta

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:

  Tag:
    name: Tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.BOT_TOKEN }}

      - name: Set tag ENV
        shell: bash
        run: |
          if [ "${GITHUB_REF_NAME}" = "master" ]; then
            echo "VERSION=v$(cat VERSION)" >> "$GITHUB_ENV"
          else
            echo "VERSION=v$(cat VERSION)-${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          fi

      - name: Check if tag already exists
        id: tagcheck
        run: |
          if git rev-parse -q --verify "refs/tags/${VERSION}" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup GIT
        uses: rebelmediausa/gitconfig@726db48f1d4a860d38ef1b6e8c3e07310159c4e9 # v1
        with:
          git_user_name: RebelBot
          git_user_email: bot@rebelmedia.io
          git_gpg_key: ${{ secrets.GPG_KEY }}
          git_gpg_key_id: ${{ secrets.GPG_KEY_ID }}

      # Pushing the tag is what starts the release, and it is the only thing
      # that needs to. The push is authenticated with BOT_TOKEN, and a push made
      # with a PAT does trigger other workflows where one made with the default
      # GITHUB_TOKEN would not, so publish.yml starts from its own
      # `on: push: tags` without being asked.
      #
      # Dispatching publish.yml from here as well ran it twice for every tag,
      # once per trigger. The two share a concurrency group and do not cancel
      # each other, so the duplicate waited its turn, rebuilt the whole
      # six-thread matrix, and then failed against a release that already
      # existed. publish.yml keeps its workflow_dispatch trigger for
      # re-publishing a tag by hand; nothing should invoke it automatically.
      - name: Create Tag
        if: steps.tagcheck.outputs.exists != 'true'
        env:
          VERSION: ${{ env.VERSION }}
        run: |
          if [ "${GITHUB_REF_NAME}" = "beta" ]; then
            git tag -s "${VERSION}" -m "Beta $(cat VERSION)"
          else
            git tag -s "${VERSION}" -m "Release $(cat VERSION)"
          fi
          git push --tags
