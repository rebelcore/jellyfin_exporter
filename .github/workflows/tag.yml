---
name: Create Tag

on:
  push:
    branches:
      - 'main'
      - 'master'
      - 'beta'
    paths:
      - 'VERSION'

jobs:

  Tag:
    name: Tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set tag ENV
        run: |
          if [ "${GITHUB_REF_NAME}" = "beta" ]; then
            raw_version="$(cat VERSION)"
            if [[ "${raw_version}" == *"-beta" ]]; then
              echo "VERSION=v${raw_version}" >> "$GITHUB_ENV"
            else
              echo "VERSION=v${raw_version}-beta" >> "$GITHUB_ENV"
            fi
          else
            echo "VERSION=v$(cat VERSION)" >> $GITHUB_ENV
          fi

      - name: Check if tag already exists
        id: tagcheck
        run: |
          if git rev-parse -q --verify "refs/tags/${VERSION}" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup GIT
        uses: rebelmediausa/gitconfig@v1
        with:
          git_user_name: RebelBot
          git_user_email: bot@rebelmedia.io
          git_gpg_key: ${{ secrets.GPG_KEY }}
          git_gpg_key_id: ${{ secrets.GPG_KEY_ID }}

      - name: Create Tag
        if: steps.tagcheck.outputs.exists != 'true'
        run: |
          if [ "${GITHUB_REF_NAME}" = "beta" ]; then
            git tag -s "${{ env.VERSION }}" -m "Beta $(cat VERSION)"
          else
            git tag -s "${{ env.VERSION }}" -m "Release $(cat VERSION)"
          fi
          git push --tags

      - name: Run Publish workflow
        if: steps.tagcheck.outputs.exists != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          gh workflow run publish.yml --ref ${{ env.VERSION }}
