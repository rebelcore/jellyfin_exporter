---
name: Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  Release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.BOT_TOKEN }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          prerelease_flag=""
          if [[ "${TAG}" == *"-beta" ]]; then
          prerelease_flag="--prerelease"
          fi

          gh release create "${TAG}" \
            --repo="$GITHUB_REPOSITORY" \
            ${prerelease_flag} \
            --title="${TAG#v} / $(date '+%Y-%m-%d')"

  Build:
    name: Build Release
    runs-on: ubuntu-latest
    needs:
      - 'Release'
    permissions:
      contents: read
    strategy:
      matrix:
        thread: [0, 1, 2, 3, 4, 5]
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Get CI Commands
        uses: rebelmediausa/promci@v1

      - name: Run Build
        uses: ./.github/promci/actions/build
        with:
          promu_codesign_binary: jellyfin_exporter
          parallelism: 6
          thread: ${{ matrix.thread }}

  Publish:
    name: Publish Release
    runs-on: ubuntu-latest
    needs:
      - 'Build'
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Get CI Commands
        uses: rebelmediausa/promci@v1

      - name: Publish Release
        uses: ./.github/promci/actions/publish_release
        with:
          image_name: jellyfin-exporter
          image_arch: linux/amd64,linux/arm64,linux/386,linux/ppc64le,linux/riscv64,linux/s390x
          docker_hub_organization: ${{ secrets.DOCKER_HUB_ORG }}
          docker_hub_login: ${{ secrets.DOCKER_HUB_LOGIN }}
          docker_hub_password: ${{ secrets.DOCKER_HUB_PASSWORD }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
