---
name: Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  Build:
    name: Build Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      matrix:
        thread: [0, 1, 2, 3, 4, 5]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Get CI Commands
        uses: rebelmediausa/promci@a0a95d4841b61b2611656c77e0525fae21883fb5 # v1.3.1

      # promu stamps the build date, user and host into the binary. With
      # SOURCE_DATE_EPOCH set it uses the commit time and "reproducible"
      # instead, so the same tag always builds the same binary.
      - name: Set the build date from the tagged commit
        id: build_date
        run: echo "epoch=$(git log -1 --format=%ct)" >> "$GITHUB_OUTPUT"

      - name: Run Build
        uses: ./.github/promci/actions/build
        with:
          promu_codesign_binary: jellyfin_exporter
          promu_opts: --env SOURCE_DATE_EPOCH=${{ steps.build_date.outputs.epoch }}
          parallelism: 6
          thread: ${{ matrix.thread }}

  Release:
    name: Create Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - 'Build'
    permissions: {}
    steps:
      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.BOT_TOKEN }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          prerelease_flag=""
          if [[ "${TAG}" == *"-beta" ]]; then
            prerelease_flag="--prerelease"
          fi

          gh release create "${TAG}" \
            --repo="$GITHUB_REPOSITORY" \
            ${prerelease_flag} \
            --title="${TAG#v} / $(date '+%Y-%m-%d')"

  Publish:
    name: Publish Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - 'Release'
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Get CI Commands
        uses: rebelmediausa/promci@a0a95d4841b61b2611656c77e0525fae21883fb5 # v1.3.1

      - name: Publish Release
        uses: ./.github/promci/actions/publish_release
        with:
          image_name: jellyfin-exporter
          image_arch: linux/amd64,linux/arm64,linux/386,linux/ppc64le,linux/riscv64,linux/s390x
          docker_hub_organization: ${{ secrets.DOCKER_HUB_ORG }}
          docker_hub_login: ${{ secrets.DOCKER_HUB_LOGIN }}
          docker_hub_password: ${{ secrets.DOCKER_HUB_PASSWORD }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

  # Signing runs as its own job so a failed signature can be retried with
  # "Re-run failed jobs": re-running Publish fails once the release assets
  # exist, because promu won't replace assets on a published release.
  Sign:
    name: Sign Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - 'Publish'
    permissions:
      contents: write
      # Keyless signing proves the workflow's identity to Sigstore with an
      # OIDC token, so no signing key is stored anywhere.
      id-token: write
    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_HUB_LOGIN }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Sign the release checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release download "${TAG}" --repo "${GITHUB_REPOSITORY}" --pattern sha256sums.txt
          cosign sign-blob --yes --bundle sha256sums.txt.sigstore.json sha256sums.txt
          gh release upload "${TAG}" sha256sums.txt.sigstore.json --clobber --repo "${GITHUB_REPOSITORY}"

      - name: Sign the container image
        env:
          IMAGE: docker.io/${{ secrets.DOCKER_HUB_ORG }}/jellyfin-exporter
          TAG: ${{ github.ref_name }}
        run: |
          digest="$(docker buildx imagetools inspect "${IMAGE}:${TAG}" --format '{{json .Manifest}}' | jq -r .digest)"
          cosign sign --yes "${IMAGE}@${digest}"
