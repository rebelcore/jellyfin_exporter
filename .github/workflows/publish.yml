---
name: Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  Release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.BOT_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease_flag=""
          if [[ "${TAG}" == *"-beta" ]]; then
            prerelease_flag="--prerelease"
          fi

          gh release create "${TAG}" \
              --repo="$GITHUB_REPOSITORY" \
              ${prerelease_flag} \
              --title="${TAG#v} / $(date '+%Y-%m-%d')"

  Build:
    name: Build Release
    runs-on: ubuntu-latest
    needs:
      - 'Release'
    permissions:
      contents: read
    strategy:
      matrix:
        thread: [0, 1, 2, 3, 4, 5]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Get CI Commands
        uses: rebelmediausa/promci@v1

      - name: Run Build
        uses: ./.github/promci/actions/build
        with:
          promu_codesign_binary: jellyfin_exporter
          parallelism: 6
          thread: ${{ matrix.thread }}

  Publish:
    name: Publish Release
    runs-on: ubuntu-latest
    needs:
      - 'Build'
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Get CI Commands
        uses: rebelmediausa/promci@v1

      - name: Determine Release Channel
        id: channel
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ "${tag}" == *"-beta" ]]; then
            echo "channel=beta" >> "$GITHUB_OUTPUT"
          else
            echo "channel=stable" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish Release (stable)
        if: steps.channel.outputs.channel == 'stable'
        uses: ./.github/promci/actions/publish_release
        with:
          image_name: jellyfin-exporter
          image_arch: linux/amd64,linux/arm64,linux/386,linux/ppc64le,linux/riscv64,linux/s390x
          docker_hub_organization: ${{ secrets.DOCKER_HUB_ORG }}
          docker_hub_login: ${{ secrets.DOCKER_HUB_LOGIN }}
          docker_hub_password: ${{ secrets.DOCKER_HUB_PASSWORD }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Release (beta, skip latest image tag)
        if: steps.channel.outputs.channel == 'beta'
        uses: ./.github/promci/actions/publish_release
        with:
          image_name: jellyfin-exporter
          image_arch: linux/amd64,linux/arm64,linux/386,linux/ppc64le,linux/riscv64,linux/s390x
          docker_hub_organization: ''
          docker_hub_login: ''
          docker_hub_password: ''
          quay_io_organization: ''
          quay_io_login: ''
          quay_io_password: ''
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to DockerHub (beta)
        if: steps.channel.outputs.channel == 'beta' && secrets.DOCKER_HUB_ORG != '' && secrets.DOCKER_HUB_LOGIN != ''
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_HUB_LOGIN }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Publish container images to DockerHub (beta, no latest)
        if: steps.channel.outputs.channel == 'beta' && secrets.DOCKER_HUB_ORG != '' && secrets.DOCKER_HUB_LOGIN != ''
        uses: docker/build-push-action@v6
        with:
          context: .
          no-cache: true
          platforms: linux/amd64,linux/arm64,linux/386,linux/ppc64le,linux/riscv64,linux/s390x
          push: true
          sbom: true
          tags: |
            docker.io/${{ secrets.DOCKER_HUB_ORG }}/jellyfin-exporter:${{ github.ref_name }}
            docker.io/${{ secrets.DOCKER_HUB_ORG }}/jellyfin-exporter:beta
