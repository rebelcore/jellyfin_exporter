---
name: OSSF Scorecard

on:
  # For the Branch-Protection check, which only reads the default branch.
  branch_protection_rule:
  # The published score is whatever this workflow last uploaded, so without a
  # schedule it goes stale between pushes and the Maintained check decays with
  # it. Weekly, off the hour, to avoid the load spike GitHub sees on the hour.
  schedule:
    - cron: '37 6 * * 2'
  # Lets a scan be forced after something the score depends on changes outside a
  # push — cutting a release, editing branch rules, publishing a badge.
  workflow_dispatch:
  push:
    branches:
      - develop

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
      id-token: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: results.sarif
